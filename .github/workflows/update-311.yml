# Stage 8: keep the RDS database up to date with the Baltimore 311 ArcGIS API.
#
# Schedule (GitHub cron is UTC and may start late on busy days):
#   Mon-Sat 10:00 UTC (6 AM EST / 7 AM EDT)  daily window update
#   Sun     10:00 UTC                         --full refresh of all 2026 records
# Manual: Actions tab -> "Update 311 data" -> "Run workflow" (pick mode / dry run).
#
# RDS only accepts connections from allowed IPs, and GitHub runners get a new IP
# every run. So each run signs in to AWS through OIDC (no stored AWS keys), adds
# its own IP to the security group, runs the update, and always removes the IP.
#
# Settings -> Secrets and variables -> Actions:
#   secrets   PGHOST, PGDATABASE, PGUSER (pipeline_writer), PGPASSWORD
#   variables AWS_ROLE_ARN, RDS_SECURITY_GROUP_ID

name: Update 311 data

on:
  schedule:
    - cron: "0 10 * * 1-6"   # daily window
    - cron: "0 10 * * 0"     # weekly full refresh (Sunday)
  workflow_dispatch:
    inputs:
      mode:
        description: "window = changes since last run; full = all 2026 records"
        type: choice
        options: [window, full]
        default: window
      dry_run:
        description: "Dry run (do everything, then roll back)"
        type: boolean
        default: false

permissions:
  id-token: write   # lets the job request an OIDC token for AWS
  contents: read

concurrency:
  group: update-311   # never two updates at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: us-east-2
      SG_ID: ${{ vars.RDS_SECURITY_GROUP_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-update.txt

      - name: Install dependencies
        run: pip install -r requirements-update.txt

      - name: Sign in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Allow this runner's IP in the RDS security group
        id: allow
        run: |
          IP=$(curl -s --max-time 10 https://checkip.amazonaws.com)
          aws ec2 authorize-security-group-ingress --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=5432,ToPort=5432,IpRanges=[{CidrIp=$IP/32,Description=github-actions-run-${{ github.run_id }}}]" \
            > /dev/null
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          sleep 10   # give the new rule a moment to take effect

      - name: Run update
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PYTHONUNBUFFERED: "1"
          MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 10 * * 0' && 'full' || 'window') || inputs.mode }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          ARGS="$DRY_RUN"
          if [ "$MODE" = "full" ]; then ARGS="--full $ARGS"; fi
          echo "mode=$MODE args=$ARGS"
          python pipeline/update_from_api.py $ARGS

      - name: Remove runner IP from the security group
        if: always() && steps.allow.outputs.ip != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=5432,ToPort=5432,IpRanges=[{CidrIp=${{ steps.allow.outputs.ip }}/32}]" \
            > /dev/null
          echo "removed"
